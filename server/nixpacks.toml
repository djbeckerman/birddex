# Nixpacks build config for Railway
# ffmpeg is required by librosa (used by birdnetlib) to decode .webm audio
# from browsers. Without it, BirdNET silently returns empty results.

# providers = ["python"] lets Nixpacks manage Python + pip + virtualenv.
# Do NOT also pin python39 in nixPkgs — that creates a second Python install
# that doesn't share the venv, causing pip installs to land in the wrong place.
# ffmpeg-full is a system binary so it's safe in nixPkgs alongside the provider.
providers = ["python"]

[phases.setup]
nixPkgs = ["ffmpeg-full"]

[start]
cmd = "uvicorn server:app --host 0.0.0.0 --port $PORT"
